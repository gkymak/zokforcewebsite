name = "zokforcewebsite"
main = "worker.js"
compatibility_date = "2024-01-01"

[assets]
directory = "./"
binding = "ASSETS"

# KV Namespaces (optional — for storing contact form and chat lead data)
# Uncomment and set IDs after creating via:
#   npx wrangler kv namespace create CONTACT_FORMS
#   npx wrangler kv namespace create ASSESSMENT_REPORTS
#
# [[kv_namespaces]]
# binding = "CONTACT_FORMS"
# id = "<your-kv-namespace-id>"
#
# [[kv_namespaces]]
# binding = "ASSESSMENT_REPORTS"
# id = "<your-kv-namespace-id>"

[vars]
ENVIRONMENT = "production"
ZOKLENS_PROXY_BASE_URL = "https://zoklens-api-staging.zokforce.com/v1"
ZOKLENS_PROXY_REQUIRED = "true"
ZOKLENS_PROXY_BYOK_REQUIRED = "false"
LLM_MODEL = "deepseek-chat"

# Secrets (set via `npx wrangler secret put <NAME>`):
#   ZOKLENS_PROXY_API_KEY           — Required for proxy chat functionality
#   ZOKLENS_PROXY_PROVIDER_API_KEY  — Optional only when ZOKLENS_PROXY_BYOK_REQUIRED=true
#   SENDGRID_API_KEY                — Optional for email delivery
